<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">&#x05D0;</div>
    <div>
      <h1>Aleph</h1>
      <p class="subtitle">AI Chat Styler</p>
    </div>
    <p class="remark-header" id="remark"></p>
    <button id="settingsBtn" class="icon-btn" title="Settings">&#x2699;</button>
  </header>

  <!-- ── Insights Zone ─────────────────────────────────────────── -->
  <section class="insights-zone" id="insightsZone">

    <div class="insight-card" id="spendCard">
      <h2>Monthly Spend</h2>
      <div class="spend-amount" id="spendAmount">$0</div>
      <div class="spend-breakdown" id="spendBreakdown">
        <span class="spend-item claude"><span class="dot"></span>Detecting...</span>
      </div>
    </div>

    <div class="insight-card" id="todayCard">
      <h2>Today</h2>
      <div class="today-stats">
        <span class="stat"><strong id="todayTime">0m</strong> time</span>
        <span class="stat"><strong id="todayMsgs">0</strong> msgs</span>
        <span class="stat"><strong id="todayTokens">~0</strong> tokens</span>
      </div>
      <div class="time-bar" id="todayTimeBar"></div>
      <div class="platform-breakdown" id="platformBreakdown"></div>
      <div class="usage-meters" id="usageMeters" style="display:none"></div>
    </div>

    <div class="insight-card" id="weekCard">
      <div class="insight-card-header">
        <h2>This Week</h2>
        <span class="trend-badge" id="weekTrend"></span>
      </div>
      <div class="sparkline" id="weekSparkline"></div>
      <div class="spark-footer">
        <span class="spark-total" id="weekTotal">0h total</span>
        <span class="spark-labels">
          <span class="spark-label-dot claude"></span>Claude
          <span class="spark-label-dot chatgpt"></span>GPT
          <span class="spark-label-dot gemini"></span>Gemini
        </span>
      </div>
    </div>

    <div class="insight-card" id="tokenCard">
      <div class="insight-card-header">
        <h2>Tokens</h2>
        <span class="trend-badge" id="tokenTrend"></span>
      </div>
      <div class="sparkline" id="tokenSparkline"></div>
      <span class="spark-total" id="tokenTotal">~0 total</span>
    </div>

    <button id="dashboardBtn" class="dashboard-btn">View Full Dashboard &rarr;</button>
  </section>

  <!-- ── Controls Zone ─────────────────────────────────────────── -->
  <section>
    <h2>Focus Mode</h2>
    <label class="toggle-row">
      <span>Hide distractions</span>
      <input type="checkbox" id="focusMode">
      <span class="toggle"></span>
    </label>
  </section>

  <section>
    <h2>Theme</h2>
    <div class="theme-grid" id="themeGrid">
      <button class="theme-swatch active" data-theme="none" title="Default (platform native)">
        <div class="swatch-preview swatch-none"></div>
        <span>Default</span>
      </button>
      <button class="theme-swatch" data-theme="warmDark" title="Warm Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #1c1917 60%, #292524); border-color: #fb923c;"></div>
        <span>Warm</span>
      </button>
      <button class="theme-swatch" data-theme="coolDark" title="Cool Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #0f172a 60%, #1e293b); border-color: #38bdf8;"></div>
        <span>Cool</span>
      </button>
      <button class="theme-swatch" data-theme="paperLight" title="Paper Light">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #faf8f5 60%, #f0ebe3); border-color: #c2410c;"></div>
        <span>Paper</span>
      </button>
      <button class="theme-swatch" data-theme="highContrast" title="High Contrast">
        <div class="swatch-preview" style="background: #000000; border-color: #fde047;"></div>
        <span>HiCon</span>
      </button>
      <button class="theme-swatch" data-theme="midnight" title="Midnight Purple">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #13111c 60%, #1e1b2e); border-color: #a78bfa;"></div>
        <span>Night</span>
      </button>
      <button class="theme-swatch" data-theme="nord" title="Nord">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #2e3440 60%, #3b4252); border-color: #88c0d0;"></div>
        <span>Nord</span>
      </button>
      <button class="theme-swatch" data-theme="dracula" title="Dracula">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #282a36 60%, #343746); border-color: #bd93f9;"></div>
        <span>Dracula</span>
      </button>
      <button class="theme-swatch" data-theme="solarized" title="Solarized Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #002b36 60%, #073642); border-color: #2aa198;"></div>
        <span>Solar</span>
      </button>
      <button class="theme-swatch" data-theme="rosePine" title="Ros&eacute; Pine">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #191724 60%, #1f1d2e); border-color: #ebbcba;"></div>
        <span>Ros&eacute;</span>
      </button>
      <button class="theme-swatch" data-theme="catppuccin" title="Catppuccin Mocha">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #1e1e2e 60%, #28283d); border-color: #cba6f7;"></div>
        <span>Catpp</span>
      </button>
      <button class="theme-swatch" data-theme="gruvbox" title="Gruvbox Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #282828 60%, #3c3836); border-color: #fe8019;"></div>
        <span>Gruvbox</span>
      </button>
      <button class="theme-swatch" data-theme="oneDark" title="One Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #282c34 60%, #2c313a); border-color: #61afef;"></div>
        <span>One Dark</span>
      </button>
      <button class="theme-swatch" data-theme="tokyoNight" title="Tokyo Night">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #1a1b26 60%, #24283b); border-color: #7aa2f7;"></div>
        <span>Tokyo</span>
      </button>
      <button class="theme-swatch" data-theme="githubDark" title="GitHub Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #0d1117 60%, #161b22); border-color: #58a6ff;"></div>
        <span>GitHub</span>
      </button>
    </div>
    <label class="toggle-row compact" id="themePlatformRow" style="display:none">
      <span>Apply only to <strong id="currentPlatformName"></strong></span>
      <input type="checkbox" id="themeApplyLocal">
      <span class="toggle small"></span>
    </label>
  </section>

  <section>
    <h2>Typography</h2>
    <label class="field">
      <span>Font family</span>
      <select id="fontFamily">
        <option value="">Default (no override)</option>
        <option value="Rubik">Rubik</option>
        <option value="Heebo">Heebo</option>
        <option value="Assistant">Assistant</option>
        <option value="Noto Sans Hebrew">Noto Sans Hebrew</option>
        <option value="Open Sans">Open Sans</option>
        <option value="Inter">Inter</option>
        <option value="IBM Plex Sans">IBM Plex Sans</option>
        <option value="Segoe UI">Segoe UI</option>
      </select>
    </label>
    <label class="field">
      <span>Font size <output id="fontSizeVal">default</output></span>
      <input type="range" id="fontSize" min="0" max="24" step="1" value="0">
    </label>
  </section>

  <section>
    <h2>Platforms</h2>
    <div class="platform-chips" id="platformChips">
      <button class="chip active" data-platform="claude" data-key="enableClaude">Claude</button>
      <button class="chip active" data-platform="chatgpt" data-key="enableChatgpt">ChatGPT</button>
      <button class="chip active" data-platform="gemini" data-key="enableGemini">Gemini</button>
    </div>
  </section>

  <footer>
    <div class="footer-row">
      <button id="settingsBtn2" title="Advanced settings">&#x2699; Settings</button>
      <button id="exportBtn" title="Export settings as JSON">Export</button>
      <button id="importBtn" title="Import settings from JSON">Import</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <p class="hint footer-hint">Alt+Shift+A to toggle on/off</p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
