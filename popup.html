<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo">&#x05D0;</div>
    <div>
      <h1>Aleph</h1>
      <p class="subtitle">AI Chat Styler v2</p>
    </div>
  </header>

  <!-- Platforms -->
  <section>
    <h2>Platforms</h2>
    <label class="toggle-row">
      <span>Claude</span>
      <input type="checkbox" id="enableClaude" checked>
      <span class="toggle"></span>
    </label>
    <label class="toggle-row">
      <span>ChatGPT</span>
      <input type="checkbox" id="enableChatgpt" checked>
      <span class="toggle"></span>
    </label>
    <label class="toggle-row">
      <span>Gemini</span>
      <input type="checkbox" id="enableGemini" checked>
      <span class="toggle"></span>
    </label>
  </section>

  <!-- BiDi -->
  <section>
    <h2>Hebrew BiDi</h2>
    <label class="toggle-row">
      <span>Auto-detect & fix RTL</span>
      <input type="checkbox" id="bidiEnabled" checked>
      <span class="toggle"></span>
    </label>
  </section>

  <!-- Theme -->
  <section>
    <h2>Theme</h2>
    <div class="theme-grid" id="themeGrid">
      <button class="theme-swatch active" data-theme="none" title="Default (platform native)">
        <div class="swatch-preview swatch-none"></div>
        <span>Default</span>
      </button>
      <button class="theme-swatch" data-theme="warmDark" title="Warm Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #1c1917 60%, #292524); border-color: #fb923c;"></div>
        <span>Warm</span>
      </button>
      <button class="theme-swatch" data-theme="coolDark" title="Cool Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #0f172a 60%, #1e293b); border-color: #38bdf8;"></div>
        <span>Cool</span>
      </button>
      <button class="theme-swatch" data-theme="paperLight" title="Paper Light">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #faf8f5 60%, #f0ebe3); border-color: #c2410c;"></div>
        <span>Paper</span>
      </button>
      <button class="theme-swatch" data-theme="highContrast" title="High Contrast">
        <div class="swatch-preview" style="background: #000000; border-color: #fde047;"></div>
        <span>HiCon</span>
      </button>
      <button class="theme-swatch" data-theme="midnight" title="Midnight Purple">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #13111c 60%, #1e1b2e); border-color: #a78bfa;"></div>
        <span>Night</span>
      </button>
      <button class="theme-swatch" data-theme="nord" title="Nord">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #2e3440 60%, #3b4252); border-color: #88c0d0;"></div>
        <span>Nord</span>
      </button>
      <button class="theme-swatch" data-theme="dracula" title="Dracula">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #282a36 60%, #343746); border-color: #bd93f9;"></div>
        <span>Dracula</span>
      </button>
      <button class="theme-swatch" data-theme="solarized" title="Solarized Dark">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #002b36 60%, #073642); border-color: #2aa198;"></div>
        <span>Solar</span>
      </button>
      <button class="theme-swatch" data-theme="rosePine" title="Ros&eacute; Pine">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #191724 60%, #1f1d2e); border-color: #ebbcba;"></div>
        <span>Ros&eacute;</span>
      </button>
      <button class="theme-swatch" data-theme="catppuccin" title="Catppuccin Mocha">
        <div class="swatch-preview" style="background: linear-gradient(135deg, #1e1e2e 60%, #28283d); border-color: #cba6f7;"></div>
        <span>Catpp</span>
      </button>
    </div>
  </section>

  <!-- Focus & Streaming -->
  <section>
    <h2>Experience</h2>
    <label class="toggle-row">
      <span>Focus mode</span>
      <input type="checkbox" id="focusMode">
      <span class="toggle"></span>
    </label>
    <p class="hint">Hides upgrade banners, promos & clutter</p>

    <label class="toggle-row">
      <span>Smooth streaming</span>
      <input type="checkbox" id="streamSmooth" checked>
      <span class="toggle"></span>
    </label>
    <p class="hint">Custom animation for streamed responses (hides platform default)</p>

    <label class="field" id="streamAnimField">
      <span>Animation style</span>
      <select id="streamAnimation">
        <option value="fadeIn">Fade In</option>
        <option value="typewriter">Typewriter</option>
        <option value="slideUp">Slide Up</option>
        <option value="glow">Glow</option>
        <option value="none">None (suppress default only)</option>
      </select>
    </label>
  </section>

  <!-- Typography -->
  <section>
    <h2>Typography</h2>

    <label class="field">
      <span>Font family</span>
      <select id="fontFamily">
        <option value="">Default (no override)</option>
        <option value="Rubik">Rubik</option>
        <option value="Heebo">Heebo</option>
        <option value="Assistant">Assistant</option>
        <option value="Noto Sans Hebrew">Noto Sans Hebrew</option>
        <option value="Open Sans">Open Sans</option>
        <option value="Inter">Inter</option>
        <option value="IBM Plex Sans">IBM Plex Sans</option>
        <option value="Segoe UI">Segoe UI</option>
      </select>
    </label>

    <label class="field">
      <span>Font size <output id="fontSizeVal">—</output></span>
      <input type="range" id="fontSize" min="0" max="24" step="1" value="0">
    </label>

    <label class="field">
      <span>Line height <output id="lineHeightVal">—</output></span>
      <input type="range" id="lineHeight" min="0" max="2.4" step="0.1" value="0">
    </label>

    <label class="field">
      <span>Paragraph spacing <output id="paragraphSpacingVal">—</output></span>
      <input type="range" id="paragraphSpacing" min="0" max="32" step="2" value="0">
    </label>
  </section>

  <!-- Code -->
  <section>
    <h2>Code Blocks</h2>

    <label class="field">
      <span>Code font</span>
      <select id="codeFontFamily">
        <option value="">Default (no override)</option>
        <option value="Fira Code">Fira Code</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
        <option value="Cascadia Code">Cascadia Code</option>
        <option value="Consolas">Consolas</option>
        <option value="Source Code Pro">Source Code Pro</option>
        <option value="IBM Plex Mono">IBM Plex Mono</option>
      </select>
    </label>

    <label class="field">
      <span>Code font size <output id="codeFontSizeVal">—</output></span>
      <input type="range" id="codeFontSize" min="0" max="22" step="1" value="0">
    </label>
  </section>

  <!-- Layout -->
  <section>
    <h2>Layout</h2>
    <label class="field">
      <span>Chat width <output id="chatWidthVal">—</output></span>
      <input type="range" id="chatWidth" min="0" max="1600" step="50" value="0">
    </label>

    <label class="field">
      <span>Message spacing <output id="messageSpacingVal">—</output></span>
      <input type="range" id="messageSpacing" min="0" max="48" step="4" value="0">
    </label>
  </section>

  <footer>
    <button id="resetBtn">Reset to defaults</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
